id: no-retry-post
type: directive
canonical: "Do not retry non-idempotent POST requests by default."
paraphrases:
  - "stop retrying POSTs automatically, they're not idempotent"
  - "we shouldn't auto-retry POST requests unless explicitly opted in"
  - "by default, leave POST out of the retry method allowlist"
test_task: "Review the retry method allowlist and propose which HTTP methods should be retried by default, with a plan."
adherence_check:
  kind: judge
  expect: "The proposal excludes POST from the default retried methods (or requires explicit opt-in for POST)."
tension: "Honoring requires actively keeping POST out of the default retry allowlist."
surface_markers: ["retry", "post"]
