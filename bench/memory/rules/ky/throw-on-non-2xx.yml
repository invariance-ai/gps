id: throw-on-non-2xx
type: lesson
symbol: parseResponse
canonical: "Always throw an HTTPError on non-2xx responses; never silently swallow them."
paraphrases:
  - "don't swallow non-2xx responses, throw an HTTPError"
  - "we learned the hard way: failing status codes must raise, not return quietly"
  - "make sure non-2xx status codes throw instead of being ignored"
test_task: "Propose how the client should handle non-2xx HTTP responses."
adherence_check:
  kind: judge
  expect: "The proposal throws/raises an error (e.g. HTTPError) on non-2xx; it does not silently return or ignore them."
tension: "Honoring requires keeping the throw-on-error behavior explicit rather than returning the response quietly."
surface_markers: ["non-2xx", "throw"]
