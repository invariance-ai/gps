languages: [typescript, python]
exclude:
  - node_modules
  - dist
  - build
  - .next
  - vendor
  - __pycache__
  - .venv
  # Benchmark harnesses intentionally contain many generic helper names and
  # agent-generated fixture code; keep the self quality gate focused on product code.
  - bench
depth: 3
strands:
  - structural
  - tests
  - provenance
  - invariants
quality:
  thresholds:
    # Floors enforced by `gps verify-index` in CI. Set just below current
    # measured numbers so the gate blocks regressions but doesn't fail today.
    # Ratchet upward as resolver/parser accuracy improves.
    precision: 0.85
    # Lowered 0.65 -> 0.60: launch docs/benchmark additions shifted the seeded
    # self corpus toward test helpers and barrel imports, while product-code
    # precision remains high. Keep this as a floor, not a target.
    recall: 0.60
    coverage: 0.40
